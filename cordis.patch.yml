# Bundle patch for `dsh plugin add dsh-token-usage-counter`.
# The stock usage-stats host row owns the same settings namespace, so disable
# it before inserting the extended accumulator from this package.
- id: usage-stats
  disabled: true

- id: ui-usage-stats
  disabled: true

- insert:
    - id: token-usage-counter
      name: dsh-token-usage-counter
      # Keep the default Web bundle self-contained for the provider routes used
      # by this package. Providers that are not present in llm-pi-ai are
      # ignored; other gateways can override this config in their profile.
      config:
        providers:
          cliproxyapi:
            api: openai-completions
            reasoning: high
            efforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          jyld:
            api: openai-completions
            models:
              deepseek-v4-flash-0731:
                efforts:
                  low: low
                  medium: medium
                  high: high
                  xhigh: xhigh
                  max: max
              deepseek-v4-pro-0813:
                efforts:
                  low: low
                  medium: medium
                  high: high
                  xhigh: xhigh
                  max: max
