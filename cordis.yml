# Optional overlay for a DeepSeek Harness web composition.
# Usage: dsh web --patch token-usage-counter/cordis.yml
# Or add the entry to your own cordis.yml.

- id: usage-stats
  # The stock web bundle owns this namespace too. Disable it before mounting
  # the extended accumulator below, otherwise settings registration collides.
  disabled: true

- insert:
    - id: token-usage-counter
      name: './src/index.ts'
      config:
        providers:
          cliproxyapi:
            api: openai-completions
            reasoning: high
            efforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          jyld:
            api: openai-completions
            models:
              deepseek-v4-flash-0731:
                efforts:
                  low: low
                  medium: medium
                  high: high
                  xhigh: xhigh
                  max: max
              deepseek-v4-pro-0813:
                efforts:
                  low: low
                  medium: medium
                  high: high
                  xhigh: xhigh
                  max: max
